[project]
name = "job-agent-cv"
version = "0.1.0"
description = "CV text extraction and schema-validated profile parsing"
requires-python = ">=3.12"
dependencies = [
    "job-agent-domain",
    "job-agent-ai",
    "job-agent-observability",
    "python-docx>=1.1.2",
    "pypdf>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent_cv"]
