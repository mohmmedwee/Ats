[project]
name = "job-agent-discovery"
version = "0.1.0"
description = "Discovery orchestration: run sources, normalize, deduplicate, persist"
requires-python = ">=3.12"
dependencies = [
    "job-agent-domain",
    "job-agent-connectors",
    "job-agent-chat",
    "job-agent-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent_discovery"]
