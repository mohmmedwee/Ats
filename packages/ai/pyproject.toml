[project]
name = "job-agent-ai"
version = "0.1.0"
description = "OpenAI-compatible provider interface and schema-validated outputs"
requires-python = ">=3.12"
dependencies = [
    "job-agent-domain",
    "job-agent-observability",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent_ai"]
