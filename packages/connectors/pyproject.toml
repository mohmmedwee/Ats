[project]
name = "job-agent-connectors"
version = "0.1.0"
description = "Job source connectors"
requires-python = ">=3.12"
dependencies = [
    "job-agent-domain",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent_connectors"]
