[project]
name = "job-agent-chat"
version = "0.1.0"
description = "Chat agent: tool registry, tiers, retrieval, and streaming"
requires-python = ">=3.12"
dependencies = [
    "job-agent-domain",
    "job-agent-ai",
    "job-agent-observability",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent_chat"]
