[project]
name = "job-agent-observability"
version = "0.1.0"
description = "Structured logging, metrics, and tracing"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.4",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent_observability"]
