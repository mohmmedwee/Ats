description = "ATS adapters and browser-assisted form filling"
requires-python = ">=3.12"
dependencies = [
    "job-agent-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent_application_automation"]
