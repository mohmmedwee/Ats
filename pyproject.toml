[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/*"]

[tool.uv.sources]
job-agent-domain = { workspace = true }
job-agent-ai = { workspace = true }
job-agent-chat = { workspace = true }
job-agent-cv = { workspace = true }
job-agent-discovery = { workspace = true }
job-agent-connectors = { workspace = true }
job-agent-matching = { workspace = true }
job-agent-application-automation = { workspace = true }
job-agent-observability = { workspace = true }
job-agent-api = { workspace = true }
job-agent-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil>=2.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "A003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["dramatiq.*", "apscheduler.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires PostgreSQL and Redis",
    "e2e: requires the full stack",
]

[tool.coverage.run]
source = ["apps", "packages"]
omit = ["*/tests/*", "*/migrations/*"]
