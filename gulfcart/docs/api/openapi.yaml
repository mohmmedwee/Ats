openapi: 3.1.0
info:
  title: GulfCart API
  version: 1.0.0
  description: >
    REST API for the GulfCart storefront and admin dashboard.
    Paths are added module by module. Milestone 1 covers health, countries, authentication, staff MFA and admin user roles.\n\nAll requests accept `Accept-Language` (ar|en) and, except health, `X-Country` (AE|SA). Every response carries `X-Request-Id`.
servers:
  - url: https://api.gulfcart.com/api/v1
  - url: http://localhost/api/v1
    description: Local Docker Compose
security:
  - sanctum: []
tags:
  - name: Catalog
  - name: Admin Catalog
  - name: Admin Suppliers
  - name: Health
  - name: Countries
  - name: Authentication
  - name: MFA
  - name: Admin

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (database, Redis, queue)
      security: []
      responses:
        '200':
          description: All dependencies reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered and signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >
            Signed in. For staff with MFA enabled, `data.mfa_required` is true and
            the session is not authenticated until `/auth/mfa/challenge` succeeds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          mfa_required: { type: boolean, description: Staff must call /auth/mfa/challenge }
                          mfa_setup_required: { type: boolean, description: Staff must enrol via /auth/mfa/setup and /auth/mfa/confirm }
                          token: { type: string, description: 'Only for non-SPA clients. Staff tokens carry the mfa:pending ability until the challenge succeeds.' }
        '401':
          description: INVALID_CREDENTIALS
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: ACCOUNT_DISABLED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Current user with roles and permissions
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Send a password reset link (same response whether or not the account exists)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset the password with the emailed token; revokes all API tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                password_confirmation: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/setup:
    post:
      tags: [MFA]
      summary: Staff only. Start TOTP enrolment
      responses:
        '200':
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          secret: { type: string }
                          otpauth_url: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: MFA_ALREADY_ENABLED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /auth/mfa/confirm:
    post:
      tags: [MFA]
      summary: Staff only. Confirm enrolment with a TOTP code; returns recovery codes once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCodeRequest' }
      responses:
        '200':
          description: MFA enabled and the current session or token is verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          recovery_codes: { type: array, items: { type: string } }
                          token: { type: string, description: Replacement full-access token (token clients only) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: MFA_CODE_INVALID or VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/mfa/challenge:
    post:
      tags: [MFA]
      summary: Staff only. Complete login with a TOTP code or a one-time recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCodeRequest' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          verified: { const: true }
                          token: { type: string, description: Replacement full-access token; the pending token is revoked }
        '403':
          description: FORBIDDEN or MFA_SETUP_REQUIRED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422':
          description: MFA_CODE_INVALID (wrong, expired or replayed code)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /countries:
    get:
      tags: [Countries]
      summary: Active launch countries
      security: []
      responses:
        '200':
          description: Countries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Country' } }
  /countries/current:
    get:
      tags: [Countries]
      summary: Country resolved from X-Country, ?country= or the default (AE)
      security: []
      parameters: [{ $ref: '#/components/parameters/Country' }]
      responses:
        '200':
          description: Current country
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Country' }
        '422':
          description: COUNTRY_NOT_SUPPORTED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /admin/users:
    get:
      tags: [Admin]
      summary: List users (permission users.manage; staff MFA required)
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [customer, staff] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of users; meta.pagination has page, per_page, total, last_page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/AdminUnauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
  /admin/users/{user}/roles:
    put:
      tags: [Admin]
      summary: Replace a user's roles (permission roles.manage; staff MFA required; audited)
      parameters:
        - { name: user, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { type: string, enum: [customer, support, operations, catalog_manager, finance, admin, super_admin] }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/AdminUnauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422':
          description: VALIDATION_FAILED (unknown role, staff role for a customer, removing own super_admin)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  # ---------- Catalog (storefront) ----------
  /categories:
    get:
      tags: [Catalog]
      summary: Active category tree (localized names)
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /categories/{slug}/products:
    get:
      tags: [Catalog]
      summary: Sellable products in a category and its subcategories
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { $ref: '#/components/responses/ProductList' }, '404': { $ref: '#/components/responses/NotFound' } }
  /products:
    get:
      tags: [Catalog]
      summary: Products sellable in the request country (published, available, authorized source, price)
      security: []
      parameters:
        - $ref: '#/components/parameters/Country'
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { $ref: '#/components/responses/ProductList' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /products/search:
    get:
      tags: [Catalog]
      summary: Search titles (English and Arabic) and brand
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - $ref: '#/components/parameters/Cursor'
      responses: { '200': { $ref: '#/components/responses/ProductList' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /products/{slug}:
    get:
      tags: [Catalog]
      summary: Product details with variants, prices and availability. Never includes supplier or cost data.
      security: []
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/ProductDetail' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}/variants:
    get:
      tags: [Catalog]
      summary: Variants with price and availability for the request country
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
  /products/{id}/availability:
    get:
      tags: [Catalog]
      summary: Aggregate and per-variant availability with delivery estimate
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }

  # ---------- Catalog (admin; permission catalog.manage, staff MFA) ----------
  /admin/categories:
    get:
      tags: [Admin Catalog]
      summary: All categories (translations included)
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/AdminForbidden' } }
    post:
      tags: [Admin Catalog]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
                name: { $ref: '#/components/schemas/Translatable' }
                parent_id: { type: [string, 'null'], format: uuid }
                sort_order: { type: integer }
                is_active: { type: boolean }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/categories/{category}:
    parameters: [{ name: category, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Admin Catalog]
      summary: Update a category (cycles rejected)
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
    delete:
      tags: [Admin Catalog]
      summary: Soft-delete an empty category (409 if it has products or children)
      responses: { '204': { $ref: '#/components/responses/NoContent' }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/products:
    get:
      tags: [Admin Catalog]
      summary: Products with variants, images, rights and listing diagnostics
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, pending_review, published, unpublished, archived] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Catalog]
      summary: Create a draft product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { $ref: '#/components/schemas/Translatable' }
                description: { $ref: '#/components/schemas/Translatable' }
                category_id: { type: [string, 'null'], format: uuid }
                brand: { type: string }
                weight_grams: { type: integer }
                hs_code: { type: string, pattern: '^\\d{4,12}$' }
                country_of_origin: { type: string, minLength: 2, maxLength: 2 }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/products/{product}:
    parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Admin Catalog]
      summary: Product details for staff
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Admin Catalog]
      summary: Update product content
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/products/{product}/availability:
    put:
      tags: [Admin Catalog]
      summary: Set per-country availability and delivery estimates
      parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countries]
              properties:
                countries:
                  type: array
                  items:
                    type: object
                    required: [country, is_available]
                    properties:
                      country: { type: string, enum: [AE, SA] }
                      is_available: { type: boolean }
                      min_days: { type: integer }
                      max_days: { type: integer }
                      restriction_reason: { type: string }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/products/{product}/{action}:
    post:
      tags: [Admin Catalog]
      summary: >
        Lifecycle transition. submit (draft→pending_review), publish (pending_review→published,
        needs catalog.publish; 422 PRODUCT_NOT_PUBLISHABLE lists problems), unpublish, return-to-draft, archive.
      parameters:
        - { name: product, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [submit, publish, unpublish, return-to-draft, archive] } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/AdminForbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/products/{product}/variants:
    post:
      tags: [Admin Catalog]
      summary: Add a variant
      parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, attributes]
              properties:
                sku: { type: string }
                attributes: { type: object, additionalProperties: { type: string } }
                weight_grams: { type: integer }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/variants/{variant}:
    patch:
      tags: [Admin Catalog]
      summary: Update a variant
      parameters: [{ name: variant, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/products/{product}/images:
    post:
      tags: [Admin Catalog]
      summary: Add an image by upload or HTTPS URL (downloaded to our storage). Rights start as pending.
      parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [rights_basis]
              properties:
                file: { type: string, format: binary }
                source_url: { type: string, format: uri }
                variant_id: { type: string, format: uuid }
                rights_basis: { type: string, enum: [supplier_agreement, own_photo, licensed] }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/images/{image}:
    parameters: [{ name: image, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Admin Catalog]
      summary: Approve or reject image usage rights (catalog.publish)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [rights_status], properties: { rights_status: { type: string, enum: [approved, rejected] } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [Admin Catalog]
      summary: Remove an image
      responses: { '204': { $ref: '#/components/responses/NoContent' } }

  # ---------- Suppliers (admin) ----------
  /admin/suppliers:
    get:
      tags: [Admin Suppliers]
      summary: Suppliers with authorizations (suppliers.manage). Credentials are never returned.
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Suppliers]
      summary: Create a supplier (pending, inactive)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, connector_type, base_currency]
              properties:
                name: { type: string }
                code: { type: string, pattern: '^[a-z0-9_-]+$' }
                connector_type: { type: string, description: 'mock, manual, or a registered authorized connector' }
                base_currency: { type: string, pattern: '^[A-Z]{3}$' }
                api_base_url: { type: string, format: uri }
                credentials_ref: { type: string, description: 'Reference to the secret store, never the secret' }
                direct_shipping_enabled: { type: boolean }
                metadata: { type: object, description: 'shipping_cost_per_unit, delivery_min_days, delivery_max_days, mock{...}' }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/suppliers/{supplier}:
    parameters: [{ name: supplier, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Admin Suppliers]
      summary: Supplier details
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Admin Suppliers]
      summary: Update a supplier
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/suppliers/{supplier}/authorizations:
    post:
      tags: [Admin Suppliers]
      summary: Record a written commercial authorization; a valid one that allows resale approves the supplier
      parameters: [{ name: supplier, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreement_reference, allows_resale, allows_api_purchasing, allows_direct_shipping, allows_image_use, countries, valid_from]
              properties:
                agreement_reference: { type: string }
                allows_resale: { type: boolean }
                allows_api_purchasing: { type: boolean }
                allows_direct_shipping: { type: boolean }
                allows_image_use: { type: boolean }
                countries: { type: array, items: { type: string, enum: [AE, SA] } }
                valid_from: { type: string, format: date }
                valid_until: { type: [string, 'null'], format: date }
                document_path: { type: string }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/suppliers/{supplier}/status:
    post:
      tags: [Admin Suppliers]
      summary: activate (requires valid authorization; 422 SUPPLIER_NOT_AUTHORIZED), deactivate, suspend, revoke
      parameters: [{ name: supplier, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { type: string, enum: [activate, deactivate, suspend, revoke] } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/suppliers/{supplier}/products:
    parameters: [{ name: supplier, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Admin Suppliers]
      summary: Supplier products with variant mappings (catalog.manage)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Suppliers]
      summary: Link a catalog product to a supplier product
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/supplier-products/{supplierProduct}:
    patch:
      tags: [Admin Suppliers]
      summary: Update cost, stock, priority or status of a supplier product
      parameters: [{ name: supplierProduct, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/supplier-products/{supplierProduct}/mappings:
    put:
      tags: [Admin Suppliers]
      summary: Replace variant mappings (variant_id → external_variant_id, optional per-variant cost/stock)
      parameters: [{ name: supplierProduct, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/supplier-products/{supplierProduct}/sync:
    post:
      tags: [Admin Suppliers]
      summary: Pull cost and stock from the connector (502 SUPPLIER_CONNECTOR_ERROR on failure)
      parameters: [{ name: supplierProduct, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /admin/imports/products:
    post:
      tags: [Admin Suppliers]
      summary: Upload a supplier CSV feed (docs/SUPPLIER_IMPORT.md); processed asynchronously
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [supplier_id, file]
              properties:
                supplier_id: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/imports/{import}:
    get:
      tags: [Admin Suppliers]
      summary: Import status with per-row errors
      parameters: [{ name: import, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: Sanctum token, or the SPA session cookie for the storefront.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: meta.pagination.next_cursor from the previous page
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    Country:
      name: X-Country
      in: header
      required: false
      schema: { type: string, enum: [AE, SA] }
  responses:
    Ok:
      description: Success envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
    Created:
      description: Created (success envelope)
      content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
    Accepted:
      description: Accepted for asynchronous processing
      content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
    NoContent:
      description: No content
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: CONFLICT or ILLEGAL_STATE_TRANSITION
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: FORBIDDEN
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminUnauthenticated:
      description: UNAUTHENTICATED, or MFA_REQUIRED when the staff session/token has not passed the MFA challenge
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminForbidden:
      description: FORBIDDEN (not staff or missing permission) or MFA_SETUP_REQUIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ProductList:
      description: Cursor-paginated product cards; meta.pagination has next_cursor, prev_cursor, limit
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties: { data: { type: array, items: { $ref: '#/components/schemas/ProductCard' } } }
    Message:
      description: Message
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data:
                    type: object
                    properties: { message: { type: string } }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { const: true }
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [VALIDATION_FAILED] }
            message: { type: string }
            details: { type: object }
        meta: { $ref: '#/components/schemas/Meta' }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?\d+\.\d{2}$', examples: ['89.00'] }
        currency: { type: string, enum: [AED, SAR] }
    HealthResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, description: false when status is down }
        data:
          type: object
          properties:
            status: { type: string, enum: [ok, down] }
            checks:
              type: object
              description: postgres, redis and queue (readiness only)
              additionalProperties: { type: string, enum: [ok, down] }
        meta: { $ref: '#/components/schemas/Meta' }
    RegisterRequest:
      type: object
      required: [name, password]
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], description: 'E.164, e.g. +971501234567' }
        password: { type: string, minLength: 10, description: Must contain letters and numbers }
        password_confirmation: { type: string }
        locale: { type: string, enum: [ar, en] }
        device_name: { type: string, description: Token name for non-SPA clients }
      description: At least one of email or phone is required.
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, description: Email or E.164 phone }
        password: { type: string }
        device_name: { type: string, description: Token name for non-SPA clients }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        type: { type: string, enum: [customer, staff] }
        status: { type: string, enum: [active, suspended, closed] }
        preferred_locale: { type: [string, 'null'] }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        mfa_enabled: { type: boolean }
    MfaCodeRequest:
      type: object
      properties:
        code: { type: string, pattern: '^\\d{6}$' }
        recovery_code: { type: string }
      description: Provide either code or recovery_code (challenge only).
    Country:
      type: object
      properties:
        code: { type: string, enum: [AE, SA] }
        name: { type: string, description: Localized by Accept-Language }
        currency: { type: string, enum: [AED, SAR] }
        default_locale: { type: string, examples: [ar-AE] }
        supported_locales: { type: array, items: { type: string } }
        timezone: { type: string, examples: [Asia/Dubai] }
    Translatable:
      type: object
      properties:
        en: { type: [string, 'null'] }
        ar: { type: [string, 'null'] }
    ProductCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        brand: { type: [string, 'null'] }
        category: { type: [object, 'null'], properties: { slug: { type: string }, name: { type: string } } }
        price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Lowest VAT-inclusive variant price }
        image: { type: [string, 'null'] }
        delivery_estimate: { type: [object, 'null'], properties: { min_days: { type: integer }, max_days: { type: integer } } }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          properties:
            description: { type: [string, 'null'] }
            images: { type: array, items: { type: object, properties: { url: { type: string }, alt: { type: [string, 'null'] }, variant_id: { type: [string, 'null'] } } } }
            availability: { type: string, enum: [in_stock, low_stock, out_of_stock] }
            prices_include_tax: { const: true }
            variants:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  sku: { type: string }
                  attributes: { type: object, additionalProperties: { type: string } }
                  price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                  availability: { type: string, enum: [in_stock, low_stock, out_of_stock] }
                  purchasable: { type: boolean }
