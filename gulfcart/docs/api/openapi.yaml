openapi: 3.1.0
info:
  title: GulfCart API
  version: 1.0.0
  description: >
    REST API for the GulfCart storefront and admin dashboard.
    Paths are added module by module. Milestone 1 covers health, countries, authentication, staff MFA and admin user roles.\n\nAll requests accept `Accept-Language` (ar|en) and, except health, `X-Country` (AE|SA). Every response carries `X-Request-Id`.
servers:
  - url: https://api.gulfcart.com/api/v1
  - url: http://localhost/api/v1
    description: Local Docker Compose
security:
  - sanctum: []
tags:
  - name: Invoices
  - name: Admin Reports
  - name: Returns
  - name: Admin Returns
  - name: Orders
  - name: Payments
  - name: Admin Orders
  - name: Admin Procurement
  - name: Admin Refunds
  - name: Cart
  - name: Checkout
  - name: Admin Pricing
  - name: Admin Country Rules
  - name: Catalog
  - name: Admin Catalog
  - name: Admin Suppliers
  - name: Health
  - name: Countries
  - name: Authentication
  - name: MFA
  - name: Admin

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe (database, Redis, queue)
      security: []
      responses:
        '200':
          description: All dependencies reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered and signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >
            Signed in. For staff with MFA enabled, `data.mfa_required` is true and
            the session is not authenticated until `/auth/mfa/challenge` succeeds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          mfa_required: { type: boolean, description: 'Staff must call /auth/mfa/challenge' }
                          mfa_setup_required: { type: boolean, description: 'Staff must enrol via /auth/mfa/setup and /auth/mfa/confirm' }
                          token: { type: string, description: 'Only for non-SPA clients. Staff tokens carry the mfa:pending ability until the challenge succeeds.' }
        '401':
          description: INVALID_CREDENTIALS
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: ACCOUNT_DISABLED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      responses:
        '204': { description: 'Logged out' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/phone/start:
    post:
      tags: [Authentication]
      summary: Send a 6-digit sign-in code by SMS to an AE/SA mobile (customers only; same response for unknown or staff numbers)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [country, phone], properties: { country: { type: string, enum: [AE, SA] }, phone: { type: string, description: 'Local or international format' } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' }, '429': { description: Too many codes requested } }
  /auth/phone/verify:
    post:
      tags: [Authentication]
      summary: Verify the SMS code; signs in and creates the customer account on first use (new_user, profile_incomplete)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, phone, code]
              properties:
                country: { type: string, enum: [AE, SA] }
                phone: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
                name: { type: string, maxLength: 150 }
                device_name: { type: string, description: Token clients only }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { description: OTP_INVALID or validation error } }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Current user with roles and permissions
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

    patch:
      tags: [Authentication]
      summary: Update own name, email (re-verification sent) or preferred locale
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, email: { type: [string, 'null'], format: email }, preferred_locale: { type: string, enum: [en, ar] } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Send a password reset link (same response whether or not the account exists)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset the password with the emailed token; revokes all API tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
                password_confirmation: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/mfa/setup:
    post:
      tags: [MFA]
      summary: Staff only. Start TOTP enrolment
      responses:
        '200':
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          secret: { type: string }
                          otpauth_url: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: MFA_ALREADY_ENABLED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /auth/mfa/confirm:
    post:
      tags: [MFA]
      summary: Staff only. Confirm enrolment with a TOTP code; returns recovery codes once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCodeRequest' }
      responses:
        '200':
          description: MFA enabled and the current session or token is verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          recovery_codes: { type: array, items: { type: string } }
                          token: { type: string, description: 'Replacement full-access token (token clients only)' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: MFA_CODE_INVALID or VALIDATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/mfa/challenge:
    post:
      tags: [MFA]
      summary: Staff only. Complete login with a TOTP code or a one-time recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCodeRequest' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          verified: { const: true }
                          token: { type: string, description: 'Replacement full-access token; the pending token is revoked' }
        '403':
          description: FORBIDDEN or MFA_SETUP_REQUIRED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422':
          description: MFA_CODE_INVALID (wrong, expired or replayed code)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /countries:
    get:
      tags: [Countries]
      summary: Active launch countries
      security: []
      responses:
        '200':
          description: Countries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Country' } }
  /countries/current:
    get:
      tags: [Countries]
      summary: Country resolved from X-Country, ?country= or the default (AE)
      security: []
      parameters: [{ $ref: '#/components/parameters/Country' }]
      responses:
        '200':
          description: Current country
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Country' }
        '422':
          description: COUNTRY_NOT_SUPPORTED
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /admin/users:
    get:
      tags: [Admin]
      summary: List users (permission users.manage; staff MFA required)
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [customer, staff] } }
        - { name: q, in: query, description: 'Name, email or phone contains', schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page of users; meta.pagination has page, per_page, total, last_page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/AdminUnauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
    post:
      tags: [Admin]
      summary: Invite a staff member (users.manage and roles.manage); a password-reset email lets them set a password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, roles]
              properties:
                name: { type: string, maxLength: 150 }
                email: { type: string, format: email }
                roles:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [support, operations, catalog_manager, finance, admin, super_admin] }
      responses: { '201': { $ref: '#/components/responses/Created' }, '403': { $ref: '#/components/responses/AdminForbidden' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/users/{user}/status:
    patch:
      tags: [Admin]
      summary: Suspend or re-activate an account (users.manage; not your own); suspending revokes API tokens
      parameters: [{ name: user, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string, enum: [active, suspended] } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/users/{user}/roles:
    put:
      tags: [Admin]
      summary: Replace a user's roles (permission roles.manage; staff MFA required; audited)
      parameters:
        - { name: user, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items: { type: string, enum: [customer, support, operations, catalog_manager, finance, admin, super_admin] }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/AdminUnauthenticated' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
        '404':
          description: NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '422':
          description: VALIDATION_FAILED (unknown role, staff role for a customer, removing own super_admin)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  # ---------- Catalog (storefront) ----------
  /categories:
    get:
      tags: [Catalog]
      summary: Active category tree (localized names)
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /categories/{slug}/products:
    get:
      tags: [Catalog]
      summary: Sellable products in a category and its subcategories
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { $ref: '#/components/responses/ProductList' }, '404': { $ref: '#/components/responses/NotFound' } }
  /products:
    get:
      tags: [Catalog]
      summary: Products sellable in the request country (published, available, authorized source, price)
      security: []
      parameters:
        - $ref: '#/components/parameters/Country'
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: ids, in: query, description: 'Comma-separated product IDs (max 100), e.g. for the wishlist', schema: { type: string } }
        - { name: brand, in: query, description: 'Brand slug(s), comma-separated', schema: { type: string } }
        - { name: price_max, in: query, schema: { type: number, minimum: 0 } }
        - { name: sale, in: query, description: 'Only products covered by a running flash sale', schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { $ref: '#/components/responses/ProductList' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /products/search:
    get:
      tags: [Catalog]
      summary: Search titles (English and Arabic) and brand
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - $ref: '#/components/parameters/Cursor'
      responses: { '200': { $ref: '#/components/responses/ProductList' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /products/{slug}:
    get:
      tags: [Catalog]
      summary: Product details with variants, prices and availability. Never includes supplier or cost data.
      security: []
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties: { data: { $ref: '#/components/schemas/ProductDetail' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}/variants:
    get:
      tags: [Catalog]
      summary: Variants with price and availability for the request country
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
  /products/{id}/availability:
    get:
      tags: [Catalog]
      summary: Aggregate and per-variant availability with delivery estimate
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }

  # ---------- Catalog (admin; permission catalog.manage, staff MFA) ----------
  /admin/categories:
    get:
      tags: [Admin Catalog]
      summary: All categories (translations included)
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/AdminForbidden' } }
    post:
      tags: [Admin Catalog]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
                name: { $ref: '#/components/schemas/Translatable' }
                parent_id: { type: [string, 'null'], format: uuid }
                sort_order: { type: integer }
                is_active: { type: boolean }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/categories/{category}:
    parameters: [{ name: category, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Admin Catalog]
      summary: Update a category (cycles rejected)
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
    delete:
      tags: [Admin Catalog]
      summary: Soft-delete an empty category (409 if it has products or children)
      responses: { '204': { $ref: '#/components/responses/NoContent' }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/products:
    get:
      tags: [Admin Catalog]
      summary: Products with variants, images, rights and listing diagnostics
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, pending_review, published, unpublished, archived] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Catalog]
      summary: Create a draft product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { $ref: '#/components/schemas/Translatable' }
                description: { $ref: '#/components/schemas/Translatable' }
                category_id: { type: [string, 'null'], format: uuid }
                brand: { type: string }
                weight_grams: { type: integer }
                hs_code: { type: string, pattern: '^\\d{4,12}$' }
                country_of_origin: { type: string, minLength: 2, maxLength: 2 }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/products/{product}:
    parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Admin Catalog]
      summary: Product details for staff
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Admin Catalog]
      summary: Update product content
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/products/{product}/availability:
    put:
      tags: [Admin Catalog]
      summary: Set per-country availability and delivery estimates
      parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countries]
              properties:
                countries:
                  type: array
                  items:
                    type: object
                    required: [country, is_available]
                    properties:
                      country: { type: string, enum: [AE, SA] }
                      is_available: { type: boolean }
                      min_days: { type: integer }
                      max_days: { type: integer }
                      restriction_reason: { type: string }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/products/{product}/{action}:
    post:
      tags: [Admin Catalog]
      summary: >
        Lifecycle transition. submit (draft→pending_review), publish (pending_review→published,
        needs catalog.publish; 422 PRODUCT_NOT_PUBLISHABLE lists problems), unpublish, return-to-draft, archive.
      parameters:
        - { name: product, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [submit, publish, unpublish, return-to-draft, archive] } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '403': { $ref: '#/components/responses/AdminForbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/products/{product}/variants:
    post:
      tags: [Admin Catalog]
      summary: Add a variant
      parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, attributes]
              properties:
                sku: { type: string }
                attributes: { type: object, additionalProperties: { type: string } }
                weight_grams: { type: integer }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/variants/{variant}:
    patch:
      tags: [Admin Catalog]
      summary: Update a variant
      parameters: [{ name: variant, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/products/{product}/images:
    post:
      tags: [Admin Catalog]
      summary: Add an image by upload or HTTPS URL (downloaded to our storage). Rights start as pending.
      parameters: [{ name: product, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [rights_basis]
              properties:
                file: { type: string, format: binary }
                source_url: { type: string, format: uri }
                variant_id: { type: string, format: uuid }
                rights_basis: { type: string, enum: [supplier_agreement, own_photo, licensed] }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/images/{image}:
    parameters: [{ name: image, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Admin Catalog]
      summary: Approve or reject image usage rights (catalog.publish)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [rights_status], properties: { rights_status: { type: string, enum: [approved, rejected] } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [Admin Catalog]
      summary: Remove an image
      responses: { '204': { $ref: '#/components/responses/NoContent' } }

  # ---------- Suppliers (admin) ----------
  /admin/suppliers:
    get:
      tags: [Admin Suppliers]
      summary: Suppliers with authorizations (suppliers.manage). Credentials are never returned.
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Suppliers]
      summary: Create a supplier (pending, inactive)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, connector_type, base_currency]
              properties:
                name: { type: string }
                code: { type: string, pattern: '^[a-z0-9_-]+$' }
                connector_type: { type: string, description: 'mock, manual, or a registered authorized connector' }
                base_currency: { type: string, pattern: '^[A-Z]{3}$' }
                api_base_url: { type: string, format: uri }
                credentials_ref: { type: string, description: 'Reference to the secret store, never the secret' }
                direct_shipping_enabled: { type: boolean }
                metadata: { type: object, description: 'shipping_cost_per_unit, delivery_min_days, delivery_max_days, mock{...}' }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/suppliers/{supplier}:
    parameters: [{ name: supplier, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Admin Suppliers]
      summary: Supplier details
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Admin Suppliers]
      summary: Update a supplier
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/suppliers/{supplier}/authorizations:
    post:
      tags: [Admin Suppliers]
      summary: Record a written commercial authorization; a valid one that allows resale approves the supplier
      parameters: [{ name: supplier, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreement_reference, allows_resale, allows_api_purchasing, allows_direct_shipping, allows_image_use, countries, valid_from]
              properties:
                agreement_reference: { type: string }
                allows_resale: { type: boolean }
                allows_api_purchasing: { type: boolean }
                allows_direct_shipping: { type: boolean }
                allows_image_use: { type: boolean }
                countries: { type: array, items: { type: string, enum: [AE, SA] } }
                valid_from: { type: string, format: date }
                valid_until: { type: [string, 'null'], format: date }
                document_path: { type: string }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/suppliers/{supplier}/status:
    post:
      tags: [Admin Suppliers]
      summary: activate (requires valid authorization; 422 SUPPLIER_NOT_AUTHORIZED), deactivate, suspend, revoke
      parameters: [{ name: supplier, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { type: string, enum: [activate, deactivate, suspend, revoke] } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/suppliers/{supplier}/products:
    parameters: [{ name: supplier, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Admin Suppliers]
      summary: Supplier products with variant mappings (catalog.manage)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Suppliers]
      summary: Link a catalog product to a supplier product
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/supplier-products/{supplierProduct}:
    patch:
      tags: [Admin Suppliers]
      summary: Update cost, stock, priority or status of a supplier product
      parameters: [{ name: supplierProduct, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/supplier-products/{supplierProduct}/mappings:
    put:
      tags: [Admin Suppliers]
      summary: Replace variant mappings (variant_id → external_variant_id, optional per-variant cost/stock)
      parameters: [{ name: supplierProduct, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/supplier-products/{supplierProduct}/sync:
    post:
      tags: [Admin Suppliers]
      summary: Pull cost and stock from the connector (502 SUPPLIER_CONNECTOR_ERROR on failure)
      parameters: [{ name: supplierProduct, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /admin/imports:
    get:
      tags: [Admin Suppliers]
      summary: Recent product imports (CSV and CJ), newest first
      parameters: [{ name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /admin/cj/products:
    get:
      tags: [Admin Suppliers]
      summary: Search the CJdropshipping catalog (catalog.manage); marks products already imported
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' }, '502': { description: CJ unreachable (SUPPLIER_UNAVAILABLE) } }
  /admin/cj/imports:
    post:
      tags: [Admin Suppliers]
      summary: Queue an import of CJ products as catalog drafts (with Arabic machine translation when enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pids]
              properties:
                pids: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                countries: { type: array, items: { type: string, enum: [AE, SA] } }
                category_slug: { type: [string, 'null'] }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/imports/products:
    post:
      tags: [Admin Suppliers]
      summary: Upload a supplier CSV feed (docs/SUPPLIER_IMPORT.md); processed asynchronously
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [supplier_id, file]
              properties:
                supplier_id: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/imports/{import}:
    get:
      tags: [Admin Suppliers]
      summary: Import status with per-row errors
      parameters: [{ name: import, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }

  /site:
    get:
      tags: [Content]
      summary: Storefront settings (support channels, footer pages, marketing tag IDs)
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /pages:
    get:
      tags: [Content]
      summary: Published content pages (localized titles)
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /pages/{slug}:
    get:
      tags: [Content]
      summary: One published page (localized title and body; contact details on the contact page)
      security: []
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }
  /admin/pages:
    get:
      tags: [Admin Content]
      summary: All pages with both languages (catalog.manage)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Content]
      summary: Create a page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title, body]
              properties:
                slug: { type: string }
                title: { $ref: '#/components/schemas/Translatable' }
                body: { $ref: '#/components/schemas/Translatable' }
                is_published: { type: boolean }
                in_footer: { type: boolean }
                sort_order: { type: integer }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/pages/{page}:
    patch:
      tags: [Admin Content]
      summary: Update a page (any subset of fields)
      parameters: [{ name: page, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/coupons:
    get:
      tags: [Admin Promotions]
      summary: Discount codes with use counts and discount given (pricing.manage)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Promotions]
      summary: Create a discount code (percent, fixed amount, or free shipping)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9_-]{3,40}$' }
                description: { type: [string, 'null'] }
                type: { type: string, enum: [percent, fixed, free_shipping] }
                value: { type: number, description: 'Percent (max 90) or amount in the country currency' }
                max_discount: { type: [number, 'null'] }
                min_subtotal: { type: [number, 'null'] }
                countries: { type: array, items: { type: string, enum: [AE, SA] } }
                starts_at: { type: [string, 'null'], format: date-time }
                ends_at: { type: [string, 'null'], format: date-time }
                usage_limit: { type: [integer, 'null'] }
                per_customer_limit: { type: integer, description: 0 means unlimited }
                is_active: { type: boolean }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/coupons/{coupon}:
    patch:
      tags: [Admin Promotions]
      summary: Update a discount code
      parameters: [{ name: coupon, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /flash-sales/current:
    get:
      tags: [Promotions]
      summary: Flash sales running now in the request country (biggest first) for the countdown banner
      security: []
      parameters: [{ $ref: '#/components/parameters/Country' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /admin/flash-sales:
    get:
      tags: [Admin Promotions]
      summary: Flash sales with status (scheduled, running, ended, paused) (pricing.manage)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Promotions]
      summary: Schedule a flash sale. Prices drop for its window; never below cost (net price stays at or above variable cost)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, percent_off, scope, starts_at, ends_at]
              properties:
                name: { type: object, properties: { en: { type: string }, ar: { type: [string, 'null'] } } }
                percent_off: { type: number, exclusiveMinimum: 0, maximum: 90 }
                scope: { type: string, enum: [all, category, product] }
                category_id: { type: [string, 'null'], format: uuid, description: 'Required for scope=category; covers sub-categories' }
                product_id: { type: [string, 'null'], format: uuid, description: Required for scope=product }
                countries: { type: array, items: { type: string, enum: [AE, SA] }, description: Empty means all countries }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                is_active: { type: boolean }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/flash-sales/{flashSale}:
    patch:
      tags: [Admin Promotions]
      summary: Update or pause a flash sale
      parameters: [{ name: flashSale, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /loyalty:
    get:
      tags: [Promotions]
      summary: 'Rewards: points balance and its value, history, unused personal codes, referral code and whether a friend''s code can still be entered'
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/Country' }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
  /loyalty/redeem:
    post:
      tags: [Promotions]
      summary: 'Convert points (multiples of min_redeem) into a one-time personal discount code worth points × point_value'
      security: [{ sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/Country' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [points], properties: { points: { type: integer, minimum: 1 } } } } }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { description: 'LOYALTY_INVALID_POINTS or LOYALTY_INSUFFICIENT', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /loyalty/referral:
    post:
      tags: [Promotions]
      summary: 'New customer enters a friend''s invite code (before the first paid order): returns a welcome code; the friend earns bonus points when that first order is paid'
      security: [{ sanctum: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, maxLength: 16 } } } } }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { description: 'REFERRAL_INVALID with reason not_found, own_code, already_used or not_new', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /admin/loyalty:
    get:
      tags: [Admin Promotions]
      summary: Outstanding points and their value, totals by type, referrals, top holders (pricing.manage)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /admin/loyalty/adjust:
    post:
      tags: [Admin Promotions]
      summary: Add or remove points for a customer with a note (audited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, points, note]
              properties: { user_id: { type: string, format: uuid }, points: { type: integer, description: Signed, not zero }, note: { type: string, maxLength: 255 } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /payments/{id}/cod-confirm:
    post:
      tags: [Payments]
      summary: 'Cash on delivery: confirm the order with the SMS code sent to the delivery phone. The order is confirmed and fulfilled; the courier collects the cash.'
      security: [{ sanctum: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, maxLength: 10 } } } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { description: COD_NOT_PENDING, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422': { description: COD_CODE_INVALID, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '429': { description: COD_CODE_LOCKED after 5 wrong codes, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /payments/{id}/cod-resend:
    post:
      tags: [Payments]
      summary: Send a new cash-on-delivery confirmation code (3 per minute)
      security: [{ sanctum: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/orders/{orderId}/cod/collected:
    post:
      tags: [Admin Orders]
