      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: [string, 'null'], maxLength: 255 } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' } }
  /admin/orders/{orderId}/cod/refused:
    post:
      tags: [Admin Orders]
      summary: 'Cash on delivery: the customer refused the parcel. Cancels the order and counts the refusal (COD_BLOCK_AFTER_REFUSALS)'
      parameters: [{ name: orderId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: [string, 'null'], maxLength: 255 } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { $ref: '#/components/responses/Conflict' } }
  /products/{productId}/reviews:
    get:
      tags: [Engagement]
      summary: Approved reviews with average and distribution; `mine` tells a signed-in customer whether they can review
      security: [{}, { sanctum: [] }]
