              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/Translatable' }
                slug: { type: string }
                description: { $ref: '#/components/schemas/Translatable' }
                is_authorized: { type: boolean, description: 'We hold a distributor/brand authorization; required in sections that only sell authorized brands' }
                authorization_note: { type: [string, 'null'] }
                is_featured: { type: boolean }
                is_active: { type: boolean }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/brands/{brand}:
    patch:
      tags: [Admin Catalog]
      summary: Update a brand (renaming updates the searchable brand name on its products)
      parameters: [{ name: brand, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/brands/{brand}/logo:
    post:
      tags: [Admin Catalog]
      summary: Upload the brand logo (png, jpg, webp or svg, max 2 MB)
      parameters: [{ name: brand, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/categories/{category}/image:
    post:
      tags: [Admin Catalog]
      summary: Upload the category picture shown on the categories page and home circles
      parameters: [{ name: category, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /countries/{code}/address-format:
    get:
      tags: [Countries]
      summary: Regions (localized), postal-code and National Address rules for address forms
      security: []
      parameters: [{ name: code, in: path, required: true, schema: { type: string, enum: [AE, SA] } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }

  # ---------- Cart (guests via X-Cart-Token, or authenticated) ----------
  /cart:
    get:
      tags: [Cart]
      summary: Current cart for the request country with live prices, stock and issues
      security: [{}, { sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CartToken' }, { $ref: '#/components/parameters/Country' }]
      responses: { '200': { $ref: '#/components/responses/CartResponse' } }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add a variant (quantity 1–20, max 50 lines). Guests receive data.guest_token to send as X-Cart-Token.
      security: [{}, { sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CartToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [variant_id, quantity], properties: { variant_id: { type: string, format: uuid }, quantity: { type: integer, minimum: 1, maximum: 20 } } }
      responses:
        '201': { $ref: '#/components/responses/CartResponse' }
        '422': { description: 'VALIDATION_FAILED, PRODUCT_NOT_AVAILABLE_IN_COUNTRY, PRODUCT_OUT_OF_STOCK, CART_LIMIT_REACHED', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /cart/items/{item}:
    parameters: [{ name: item, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/CartToken' }]
    patch:
      tags: [Cart]
      summary: Change quantity
      security: [{}, { sanctum: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 1, maximum: 20 } } } } }
      responses: { '200': { $ref: '#/components/responses/CartResponse' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [Cart]
      summary: Remove a line
      security: [{}, { sanctum: [] }]
      responses: { '200': { $ref: '#/components/responses/CartResponse' }, '404': { $ref: '#/components/responses/NotFound' } }
  /cart/validate:
    post:
      tags: [Cart]
      summary: Revalidate prices and stock; reports PRICE_CHANGED / OUT_OF_STOCK / UNAVAILABLE and acknowledges new prices
      security: [{}, { sanctum: [] }]
      parameters: [{ $ref: '#/components/parameters/CartToken' }]
      responses: { '200': { $ref: '#/components/responses/CartResponse' }, '422': { description: 'CART_EMPTY', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } } }

  # ---------- Addresses & checkout (customer) ----------
  /addresses:
    get:
      tags: [Checkout]
      summary: Customer address book
      responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthenticated' } }
    post:
      tags: [Checkout]
      summary: Add an address validated by country rules (AE emirates/+9715, SA regions/+9665, postal code, National Address)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, full_name, phone, address_line_1, city, state]
              properties:
                country: { type: string, enum: [AE, SA] }
                full_name: { type: string }
                phone: { type: string }
                address_line_1: { type: string }
                address_line_2: { type: string }
                district: { type: string }
                city: { type: string }
                state: { type: string, description: 'Region/emirate code from /countries/{code}/address-format' }
                postal_code: { type: string }
                national_address_code: { type: string, description: 'SA only (example RRRD2929)' }
                is_default: { type: boolean }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /addresses/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Checkout]
      summary: Update an own address
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
    delete:
      tags: [Checkout]
      summary: Delete an own address
      responses: { '204': { $ref: '#/components/responses/NoContent' }, '404': { $ref: '#/components/responses/NotFound' } }
  /checkout/shipping-options:
    post:
      tags: [Checkout]
      summary: Shipping methods and fees for the current cart and address
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [address_id], properties: { address_id: { type: string, format: uuid } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /checkout/quote:
    post:
      tags: [Checkout]
      summary: Full price quote (not persisted)
      requestBody: { $ref: '#/components/requestBodies/CheckoutRequest' }
      responses:
        '200':
          description: Quote
          content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/SuccessEnvelope' }, { properties: { data: { $ref: '#/components/schemas/Quote' } } }] } } }
        '422': { description: 'CART_EMPTY, ADDRESS_COUNTRY_MISMATCH, PRODUCT_NOT_AVAILABLE_IN_COUNTRY, PRODUCT_OUT_OF_STOCK, VALIDATION_FAILED', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /checkout:
    post:
      tags: [Checkout]
      summary: Create a checkout session with a locked quote (live supplier stock check; expires after 30 minutes)
      requestBody: { $ref: '#/components/requestBodies/CheckoutRequest' }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /checkout/{id}:
    get:
      tags: [Checkout]
      summary: Checkout session (status open | expired | completed | cancelled)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } }

  # ---------- Pricing (admin; pricing.manage) ----------
  /admin/pricing-rules:
    get:
      tags: [Admin Pricing]
      summary: Pricing rules
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Pricing]
      summary: Create a rule (global | country | supplier | category | product); triggers repricing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, rule_type, value]
              properties:
                scope: { type: string, enum: [global, country, supplier, category, product] }
                country: { type: string, enum: [AE, SA] }
                supplier_id: { type: string, format: uuid }
                category_id: { type: string, format: uuid }
                product_id: { type: string, format: uuid }
                rule_type: { type: string, enum: [margin_percent, markup_percent, fixed_markup] }
                value: { type: number }
                min_margin_percent: { type: number }
                max_selling_price: { type: number }
                priority: { type: integer }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/pricing-rules/{pricingRule}:
    patch:
      tags: [Admin Pricing]
      summary: Update a rule; triggers repricing
      parameters: [{ name: pricingRule, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/pricing/simulate:
    post:
      tags: [Admin Pricing]
      summary: Run the pricing engine on arbitrary inputs (422 PRICING_REJECTED with reason)
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/exchange-rates:
    get:
      tags: [Admin Pricing]
      summary: Latest rate per pair with staleness flag
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Pricing]
      summary: Enter a manual rate (audited); triggers repricing
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [base, target, rate], properties: { base: { type: string }, target: { type: string }, rate: { type: number } } } } }
      responses: { '201': { $ref: '#/components/responses/Created' } }

  # ---------- Country rules (admin; countries.manage) ----------
  /admin/tax-rules:
    get:
      tags: [Admin Country Rules]
      summary: VAT and import VAT rules (effective-dated, optional category override)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Country Rules]
      summary: Add a tax rule
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/tax-rules/{taxRule}:
    patch:
      tags: [Admin Country Rules]
      summary: Update a tax rule
      parameters: [{ name: taxRule, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /admin/customs-rules:
    get:
      tags: [Admin Country Rules]
      summary: Customs duty rules (default and HS-prefix specific, de minimis)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Country Rules]
      summary: Add a customs rule
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/customs-rules/{customsRule}:
    patch:
      tags: [Admin Country Rules]
      summary: Update a customs rule
      parameters: [{ name: customsRule, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /admin/shipping-methods:
    get:
      tags: [Admin Country Rules]
      summary: Customer shipping methods per country (flat or weight bands, free threshold)
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [Admin Country Rules]
      summary: Add a shipping method
      responses: { '201': { $ref: '#/components/responses/Created' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/shipping-methods/{shippingMethod}:
    patch:
      tags: [Admin Country Rules]
      summary: Update a shipping method
      parameters: [{ name: shippingMethod, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  # ---------- Orders (customer) ----------
  /orders:
    get:
      tags: [Orders]
      summary: Customer orders (cursor pagination)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Orders]
      summary: Create an order (pending_payment) from a valid checkout session
      description: >
        One order per checkout session; repeating the call returns the same order.
        Requires an Idempotency-Key header. 410 QUOTE_EXPIRED when the session expired.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checkout_session_id]
              properties:
                checkout_session_id: { type: string, format: uuid }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: QUOTE_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /orders/track:
    post:
      tags: [Orders]
      summary: 'Track without signing in: order number + phone on the delivery address. Progress only (timeline, estimate, carrier events); no prices or address. 10 per minute.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [order_number, phone], properties: { order_number: { type: string, maxLength: 30 }, phone: { type: string, maxLength: 30 } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Order details grouped into packages (one per supplier shipment) with tracking
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/tracking:
    get:
      tags: [Orders]
      summary: Shipments with carrier, tracking number and events
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: >
        Unpaid orders are cancelled immediately. Paid orders are cancelled and fully refunded
        only while no supplier purchase exists; otherwise 409 CANCELLATION_NOT_POSSIBLE.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------- Payments ----------
  /payments/intent:
    post:
      tags: [Payments]
      summary: Create (or reuse) a payment intent for the amount due; returns redirect_url
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: string, format: uuid }
                provider: { type: string, description: 'One of GET /payments/methods; default provider when omitted' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '409':
          description: ORDER_ALREADY_PAID or ORDER_NOT_PAYABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /payments/{id}:
    get:
      tags: [Payments]
      summary: Payment status (own orders only)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/{id}/sandbox-complete:
    post:
      tags: [Payments]
      summary: Sandbox gateway only (never in production) - simulate the customer completing payment
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [success, failure] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/payments/{provider}:
    post:
      tags: [Payments]
      summary: Payment provider webhook
      description: >
        Unauthenticated; trust comes only from the provider signature, checked together with a
        5-minute timestamp tolerance. Events are deduplicated by provider event ID and processed
        in a transaction. Captures with a mismatched amount or currency are rejected and logged.
      security: []
      parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: 'data.result is processed, duplicate, ignored or failed'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401':
          description: WEBHOOK_SIGNATURE_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ---------- Admin orders, procurement, refunds ----------
  /admin/orders:
    get:
      tags: [Admin Orders]
      summary: Orders with estimated landed cost and contribution (orders.view_any)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/orders/{order}:
    get:
      tags: [Admin Orders]
      summary: Order with items, costs and fulfilment state
      parameters: [{ name: order, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/procurement:
    get:
      tags: [Admin Procurement]
      summary: Procurement tasks, exceptions first, with counts per status in meta.counts (procurement.view)
      parameters:
        - name: status
          in: query
          description: Comma-separated task statuses
          schema: { type: string, examples: ['exception,manual'] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/procurement/{task}:
    get:
      tags: [Admin Procurement]
      summary: Task with supplier order, items and the attempt log
      parameters: [{ name: task, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/procurement/{task}/retry:
    post:
      tags: [Admin Procurement]
      summary: Retry an exception (procurement.act)
      description: >
        Set new_idempotency_key=true only after confirming with the supplier that no order exists
        for the previous key. It is required after UNKNOWN_OUTCOME_UNRESOLVED.
      parameters:
        - { name: task, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/procurement/{task}/approve:
    post:
      tags: [Admin Procurement]
      summary: Record a purchase placed manually by an operator
      parameters:
        - { name: task, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_order_id, actual_cost]
              properties:
                external_order_id: { type: string }
                actual_cost: { type: number }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/procurement/{task}/switch-source:
    post:
      tags: [Admin Procurement]
      summary: Move the items to another eligible supplier; the old supplier order is cancelled
      parameters:
        - { name: task, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_product_id]
              properties:
                supplier_product_id: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/procurement/{task}/cancel:
    post:
      tags: [Admin Procurement]
      summary: Cancel the supplier order and optionally refund its items
      parameters:
        - { name: task, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refund]
              properties:
                refund: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/refunds:
    get:
      tags: [Admin Refunds]
      summary: Refunds (filter by status or order_id)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Admin Refunds]
      summary: Request a refund (refunds.request)
      description: >
        Approvers' refunds up to the threshold (500 AED or SAR) execute immediately; larger ones
        or requests by non-approvers wait for a different approver (four-eyes).
        422 REFUND_EXCEEDS_CAPTURED when captured minus refunded minus in-flight is too small.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, amount, reason_code]
              properties:
                order_id: { type: string, format: uuid }
                amount: { type: string, examples: ['20.00'] }
                reason_code: { type: string, enum: [customer_request, procurement_failed, damaged, not_delivered, goodwill, cancellation, price_adjustment] }
                reason: { type: string }
                items:
                  type: object
                  description: Order item ID mapped to refunded quantity
                  additionalProperties: { type: integer }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/refunds/{refund}/approve:
    post:
      tags: [Admin Refunds]
      summary: Approve and execute a requested refund (refunds.approve; 403 FOUR_EYES_REQUIRED for the requester)
      parameters: [{ name: refund, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/AdminForbidden' }
  /admin/refunds/{refund}/reject:
    post:
      tags: [Admin Refunds]
      summary: Reject a requested refund
      parameters: [{ name: refund, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------- Returns ----------
  /orders/{id}/return:
    post:
      tags: [Returns]
      summary: Request a return for delivered items
      description: >
        Allowed within the country return window (countries.settings.returns.window_days; AE 14, SA 7).
        The quantity cannot exceed what is not yet refunded or reserved by an open return.
        422 ITEM_NOT_RETURNABLE or RETURN_WINDOW_CLOSED.
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [order_item_id, quantity, reason_code]
                    properties:
                      order_item_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                      reason_code: { type: string, enum: [damaged, wrong_item, not_as_described, size_fit, changed_mind, other] }
                note: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /returns:
    get:
      tags: [Returns]
      summary: Customer return requests
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /returns/{id}:
    get:
      tags: [Returns]
      summary: Return request details
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/returns:
    get:
      tags: [Admin Returns]
      summary: Return requests (orders.view_any)
      parameters: [{ name: status, in: query, schema: { type: string } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/returns/{return}/{action}:
    post:
      tags: [Admin Returns]
      summary: approve, reject, receive, or refund (refund pays unit price × returned quantity)
      parameters:
        - { name: return, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [approve, reject, receive, refund] } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------- Admin reports, audit, countries ----------
  /admin/dashboard:
    get:
      tags: [Admin Reports]
      summary: Operational KPIs (orders.view_any)
      description: >
        Paid orders and revenue today per currency, orders by status, procurement queue,
        refunds awaiting approval, open returns, sellable products per country, FX staleness
        and failed outbox events.
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/finance/profit:
    get:
      tags: [Admin Reports]
      summary: 'Profit for one country and period: totals, daily series, top and loss-making products (revenue ex VAT after discounts and refunds, minus landed cost at locked FX, minus estimated payment fees)'
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: country, in: query, required: true, schema: { type: string, enum: [AE, SA] } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { $ref: '#/components/responses/ValidationFailed' } }
  /admin/finance/reports:
    get:
      tags: [Admin Reports]
      summary: Finance report per country and currency (pricing.manage or audit.view)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: country, in: query, schema: { type: string, enum: [AE, SA] } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /admin/audit-logs:
    get:
      tags: [Admin Reports]
      summary: Append-only audit trail (audit.view)
      parameters:
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, description: Prefix match, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/countries:
    get:
      tags: [Admin Country Rules]
      summary: Countries with operational settings (countries.manage)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /admin/countries/{code}:
    patch:
      tags: [Admin Country Rules]
      summary: Update rounding, return window, payment methods, seller and importer details (audited)
      parameters: [{ name: code, in: path, required: true, schema: { type: string, enum: [AE, SA] } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ---------- Verification ----------
  /auth/otp/send:
    post:
      tags: [Authentication]
      summary: Send a 6-digit SMS code to verify a UAE or KSA mobile number (3 per 10 minutes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, examples: ['+971501234567'] }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/verify-otp:
    post:
      tags: [Authentication]
      summary: Verify the code (10-minute expiry, 5 attempts, single use); sets phone_verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '422':
          description: OTP_INVALID or VALIDATION_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/email/verify/{id}/{hash}:
    get:
      tags: [Authentication]
      summary: Signed link from the verification email (relative signature, 24 hours)
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: hash, in: path, required: true, schema: { type: string } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /auth/email/resend:
    post:
      tags: [Authentication]
      summary: Resend the verification email
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------- Invoices ----------
  /orders/{id}/invoices:
    get:
      tags: [Invoices]
      summary: Tax invoice and credit notes of an order (owner or orders.view_any)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{id}:
    get:
      tags: [Invoices]
      summary: Invoice or credit note (gapless number per country and year; ZATCA QR payload for SA)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invoices/{id}/html:
    get:
      tags: [Invoices]
      summary: Printable bilingual HTML document
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: HTML document
          content:
            text/html:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: Sanctum token, or the SPA session cookie for the storefront.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
    CartToken:
      name: X-Cart-Token
      in: header
      required: false
      schema: { type: string }
      description: Guest cart token; merged into the customer's cart on the first authenticated request carrying it
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: meta.pagination.next_cursor from the previous page
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    Country:
      name: X-Country
      in: header
      required: false
      schema: { type: string, enum: [AE, SA] }
  requestBodies:
    CheckoutRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [address_id, shipping_method]
            properties:
              address_id: { type: string, format: uuid }
              shipping_method: { type: string, examples: [standard, express] }
              coupon_code: { type: string, maxLength: 40, description: 'Optional discount code; COUPON_INVALID with details.reason when it cannot be used' }
  responses:
    Ok:
      description: Success envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
    Created:
      description: Created (success envelope)
      content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
    Accepted:
      description: Accepted for asynchronous processing
      content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
    NoContent:
      description: No content
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: CONFLICT or ILLEGAL_STATE_TRANSITION
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationFailed:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: FORBIDDEN
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminUnauthenticated:
      description: UNAUTHENTICATED, or MFA_REQUIRED when the staff session/token has not passed the MFA challenge
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminForbidden:
      description: FORBIDDEN (not staff or missing permission) or MFA_SETUP_REQUIRED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CartResponse:
      description: Cart with items, subtotal, issues and valid flag (guest carts include guest_token)
      content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
    ProductList:
      description: Cursor-paginated product cards; meta.pagination has next_cursor, prev_cursor, limit
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties: { data: { type: array, items: { $ref: '#/components/schemas/ProductCard' } } }
    Message:
      description: Message
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - properties:
                  data:
                    type: object
                    properties: { message: { type: string } }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { const: true }
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [VALIDATION_FAILED] }
            message: { type: string }
            details: { type: object }
        meta: { $ref: '#/components/schemas/Meta' }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?\d+\.\d{2}$', examples: ['89.00'] }
        currency: { type: string, enum: [AED, SAR] }
    HealthResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, description: 'false when status is down' }
        data:
          type: object
          properties:
            status: { type: string, enum: [ok, down] }
            checks:
              type: object
              description: postgres, redis and queue (readiness only)
              additionalProperties: { type: string, enum: [ok, down] }
        meta: { $ref: '#/components/schemas/Meta' }
    RegisterRequest:
      type: object
      required: [name, password]
      properties:
        name: { type: string, maxLength: 150 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], description: 'E.164, e.g. +971501234567' }
        password: { type: string, minLength: 10, description: 'Must contain letters and numbers' }
        password_confirmation: { type: string }
        locale: { type: string, enum: [ar, en] }
        device_name: { type: string, description: 'Token name for non-SPA clients' }
      description: At least one of email or phone is required.
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, description: 'Email or E.164 phone' }
        password: { type: string }
        device_name: { type: string, description: 'Token name for non-SPA clients' }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        type: { type: string, enum: [customer, staff] }
        status: { type: string, enum: [active, suspended, closed] }
        preferred_locale: { type: [string, 'null'] }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
        mfa_enabled: { type: boolean }
    MfaCodeRequest:
      type: object
      properties:
        code: { type: string, pattern: '^\\d{6}$' }
        recovery_code: { type: string }
      description: Provide either code or recovery_code (challenge only).
    Country:
      type: object
      properties:
        code: { type: string, enum: [AE, SA] }
        name: { type: string, description: 'Localized by Accept-Language' }
        currency: { type: string, enum: [AED, SAR] }
        default_locale: { type: string, examples: [ar-AE] }
        supported_locales: { type: array, items: { type: string } }
        timezone: { type: string, examples: [Asia/Dubai] }
    Translatable:
      type: object
      properties:
        en: { type: [string, 'null'] }
        ar: { type: [string, 'null'] }
    ProductCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        brand: { type: [string, 'null'] }
        category: { type: [object, 'null'], properties: { slug: { type: string }, name: { type: string } } }
        price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'Lowest VAT-inclusive variant price' }
        image: { type: [string, 'null'] }
        delivery_estimate: { type: [object, 'null'], properties: { min_days: { type: integer }, max_days: { type: integer } } }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          properties:
            description: { type: [string, 'null'] }
            images: { type: array, items: { type: object, properties: { url: { type: string }, alt: { type: [string, 'null'] }, variant_id: { type: [string, 'null'] } } } }
            availability: { type: string, enum: [in_stock, low_stock, out_of_stock] }
            prices_include_tax: { const: true }
            variants:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  sku: { type: string }
                  attributes: { type: object, additionalProperties: { type: string } }
                  price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
                  availability: { type: string, enum: [in_stock, low_stock, out_of_stock] }
                  purchasable: { type: boolean }
    Quote:
      type: object
      description: VAT-inclusive prices; tax is the VAT contained in total (total = subtotal + shipping + customs − discount)
      properties:
        currency: { type: string, enum: [AED, SAR] }
        country: { type: string }
        items: { type: array, items: { type: object } }
        shipments:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              item_count: { type: integer }
              customs: { $ref: '#/components/schemas/Money' }
              estimate: { type: object, properties: { min_days: { type: integer }, max_days: { type: integer } } }
        shipping_method: { type: object }
        subtotal: { type: string }
        shipping: { type: string }
        customs: { type: string }
        discount: { type: string }
        tax: { type: string }
        total: { type: string }
        prices_include_tax: { const: true }
