# Development stack. See docs/DEPLOYMENT.md for production hardening.
name: gulfcart

x-api: &api
  build: { context: ./apps/api, target: dev }
  volumes: ["./apps/api:/var/www/html"]
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    MAIL_HOST: mailpit
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["${GULFCART_HTTP_PORT:-80}:80"]
    volumes: ["./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: { condition: service_healthy }
      storefront: { condition: service_started }

  api:
    <<: *api
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health", "--ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    <<: *api
    command: ["php", "artisan", "queue:work", "redis", "--queue=procurement,payments,outbox,notifications,default", "--tries=1", "--max-time=3600"]
    depends_on:
      api: { condition: service_healthy }

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api: { condition: service_healthy }

  storefront:
    build: { context: ./apps/storefront, target: dev }
    volumes:
      - "./apps/storefront:/app"
      - "storefront_node_modules:/app/node_modules"
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gulfcart
      POSTGRES_USER: gulfcart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gulfcart_dev_only}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gulfcart -d gulfcart"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

volumes:
  postgres_data:
  redis_data:
  storefront_node_modules:
