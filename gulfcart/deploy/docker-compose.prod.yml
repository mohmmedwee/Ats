# Production stack for one server (4 vCPU / 8 GB RAM is plenty to start).
# Usage: see docs/DEPLOY.md. Secrets come from deploy/.env (never committed).
name: gulfcart-prod

x-api: &api
  image: gulfcart-api:${RELEASE:-latest}
  build: { context: ../apps/api, target: prod }
  env_file: ./api.env
  environment:
    APP_ENV: production
    DB_HOST: postgres
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD}
  volumes: ["storage_public:/var/www/html/storage/app/public"]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  caddy:
    # Automatic HTTPS (Let's Encrypt) for the shop and the API host.
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on: [nginx]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_public:/var/www/html/storage/app/public:ro
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      storefront: { condition: service_started }

  api:
    <<: *api
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health", "--ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *api
    command: ["php", "artisan", "queue:work", "redis", "--queue=procurement,payments,outbox,notifications,default", "--tries=1", "--max-time=3600"]
    depends_on: { api: { condition: service_healthy } }

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    depends_on: { api: { condition: service_healthy } }

  outbox:
    <<: *api
    command: ["php", "artisan", "outbox:work", "--sleep=1", "--max-time=3600"]
    depends_on: { api: { condition: service_healthy } }

  migrate:
    # One-off: docker compose -f deploy/docker-compose.prod.yml run --rm migrate
    <<: *api
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --force && php artisan storage:link || true"]
    restart: "no"
    profiles: ["tools"]

  storefront:
    image: gulfcart-storefront:${RELEASE:-latest}
    build: { context: ../apps/storefront, target: prod }
    environment:
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_INTERNAL: http://nginx/api/v1
      NUXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gulfcart
      POSTGRES_USER: gulfcart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gulfcart -d gulfcart"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 512mb --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      retries: 10

  backup:
    # Daily database dump kept 14 days in the backups volume; copy it off the server (docs/DEPLOY.md).
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: gulfcart
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: gulfcart
      BACKUP_DIR: /backups
    volumes:
      - ../infrastructure/scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - backups:/backups
    entrypoint: ["sh", "-c", "while true; do sh /usr/local/bin/backup-postgres.sh; sleep 86400; done"]
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }

volumes:
  postgres_data:
  redis_data:
  storage_public:
  caddy_data:
  caddy_config:
  backups:
