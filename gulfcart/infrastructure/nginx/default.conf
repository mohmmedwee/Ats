# Same-origin routing: the browser talks to one host, so Sanctum SPA cookies
# and CSRF work without CORS. /api and /sanctum go to Laravel (PHP-FPM),
# everything else to the Nuxt server.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream storefront { server storefront:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(api|sanctum)/ {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_REQUEST_ID $http_x_request_id;
        fastcgi_read_timeout 60s;
    }

    location / {
        proxy_pass http://storefront;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
