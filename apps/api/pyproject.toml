[project]
name = "job-agent-api"
version = "0.1.0"
description = "FastAPI application"
requires-python = ">=3.12"
dependencies = [
    "job-agent-domain",
    "job-agent-ai",
    "job-agent-chat",
    "job-agent-cv",
    "job-agent-matching",
    "job-agent-connectors",
    "job-agent-observability",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "redis>=5.2",
    "dramatiq[redis]>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent_api"]
