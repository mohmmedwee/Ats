[project]
name = "job-agent-worker"
version = "0.1.0"
description = "Background workers and scheduler"
requires-python = ">=3.12"
dependencies = [
    "job-agent-domain",
    "job-agent-connectors",
    "job-agent-matching",
    "job-agent-observability",
    "dramatiq[redis]>=1.17",
    "apscheduler>=3.11",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_agent_worker"]
